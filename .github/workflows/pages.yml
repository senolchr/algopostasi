name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Türkiye saati 13:00 ve 19:00 (UTC+3) — birkaç dakika sonra çalışır
    - cron: '2 10 * * *'
    - cron: '2 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
